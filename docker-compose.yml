services:
  reference-service:
    build: .
    environment:
      # Local Docker Compose reads these from .env. In Portainer, define the
      # same variables in the Stack's Environment variables form instead.
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env or Portainer Stack environment variables}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?Set SERVICE_TOKEN in .env or Portainer Stack environment variables}
      ZENODO_RECORD_ID: ${ZENODO_RECORD_ID:-16417648}
      REFERENCE_VECTOR_POINTS: ${REFERENCE_VECTOR_POINTS:-512}
      PUBCHEM_TIMEOUT_SECONDS: ${PUBCHEM_TIMEOUT_SECONDS:-12}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Keep Docker data in its named volume even when .env is configured for
      # convenient local Python development.
      REFERENCE_DATA_DIR: /data
      REFERENCE_SOURCE_DIR: /data/source
      # Comma-separated static app origins permitted to call the public API.
      # Example: https://vibe.nikolaisemenov.com
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      # Optional regular expression, useful for localhost on any development port.
      CORS_ALLOW_ORIGIN_REGEX: ${CORS_ALLOW_ORIGIN_REGEX:-}
    ports:
      - "${REFERENCE_PORT:-8088}:8080"
    volumes:
      # Always mount the named Docker volume at the same path used by the
      # container environment above. Local .env paths are for uvicorn only.
      - reference-data:/data
    restart: unless-stopped

volumes:
  reference-data:
